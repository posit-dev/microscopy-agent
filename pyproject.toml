[project]
name = "commons-microscopy-demo"
version = "0.1.0"
description = "A Commons demo for trusted BBBC013 microscopy analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chatlas>=0.22.0",
    "commons",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=11",
    "pyarrow>=17",
    "scikit-image>=0.24",
    "scipy>=1.14",
    "shiny>=1.7.0",
    "shinychat>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.uv.sources]
commons = { path = "../commons/pkg-py", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
